{% load static i18n humanize in_list %}

<div class="d-grid">
  <button class="btn btn-light"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#collapseKbitems"
          aria-expanded="false"
          aria-controls="collapseKbitems">{% translate "Knowledge base items" %}</button>
</div>
<div class="collapse my-3" id="collapseKbitems">
  {% with unassigned=-1 %}
    <div class="form-check">
      <input class="form-check-input"
             type="checkbox"
             name="kbitem"
             value="{{ unassigned }}"
             id="kbitem-check-{{ unassigned }}"
             {% if query_params.filtering_null.kbitem__isnull %}checked{% endif %} />
      <label class="form-check-label" for="kbitem-check-{{ unassigned }}">{% translate "Uncategorized" %}</label>
    </div>
  {% endwith %}
  {% for s in kbitem_choices %}
    <div class="form-check">
      <input class="form-check-input"
             type="checkbox"
             name="kbitem"
             value="{{ s.0 }}"
             id="kbitem-check-{{ s.0 }}"
             {% if s.0|in_list:query_params.filtering.kbitem__in %}checked{% endif %} />
      <label class="form-check-label" for="kbitem-check-{{ s.0 }}">{{ s.1 }}</label>
    </div>
  {% endfor %}
</div>
