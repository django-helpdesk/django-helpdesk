{% load i18n humanize static %}

<div class="d-grid">
  <button class="btn bg-secondary-subtle text-secondary-emphasis"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#collapseSorting"
          aria-expanded="true"
          aria-controls="collapseSorting">{% translate "Sorting" %}</button>
</div>
<div class="collapse show my-3" id="collapseSorting">
  <label id="sort-by" class="form-label" for="id_sort">{% translate "Sorting" %}</label>
  <select class="form-select" id="id_sort" name="sort">
    <option value='id'{% if query_params.sorting == "id" %} selected{% endif %}>{% translate "Ticket" %}</option>
    <option value='created'{% if query_params.sorting == "created" %} selected{% endif %}>
      {% translate "Created" %}
    </option>
    <option value='last_followup'{% if query_params.sorting == "last_followup" %} selected{% endif %}>
      {% translate "Last Followup" %}
    </option>
    <option value='due_date'{% if query_params.sorting == "due_date" %} selected{% endif %}>
      {% translate "Due Date" %}
    </option>
    <option value='title'{% if query_params.sorting == "title" %} selected{% endif %}>{% translate "Title" %}</option>
    <option value='queue'{% if query_params.sorting == "queue" %} selected{% endif %}>{% translate "Queue" %}</option>
    <option value='status'
            {% if query_params.sorting == "status" %}
              selected{% endif %}>{% translate "Status" %}</option>
    <option value='priority'{% if query_params.sorting == "priority" %} selected{% endif %}>
      {% translate "Priority" %}
    </option>
    <option value='assigned_to'{% if query_params.sorting == "assigned_to" %} selected{% endif %}>
      {% translate "Owner" %}
    </option>
    <option value='submitter_email'{% if query_params.sorting == "submitter_email" %} selected{% endif %}>
      {% translate "Submitter E-Mail" %}
    </option>
    {% if helpdesk_settings.HELPDESK_KB_ENABLED %}
      <option value='kbitem'
              {% if query_params.sorting == "kbitem" %}
                selected{% endif %}>{% translate "KB Item" %}</option>
    {% endif %}
  </select>
  <div class="form-check mt-3">
    <label class="form-check-label" for="id_sortreverse">{% translate "Reverse?" %}</label>
    <input class="form-check-input"
           type="checkbox"
           name="sortreverse"
           id="id_sortreverse"
           {% if query_params.sortreverse %}
             checked='checked'{% endif %} />
  </div>
  <div class="form-text">{% translate "Ordering applied to tickets" %}</div>
</div>
