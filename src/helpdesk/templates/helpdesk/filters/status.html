{% load static i18n humanize in_list %}

<div class="d-grid">
  <button class="btn btn-light"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#collapseStatus"
          aria-expanded="true"
          aria-controls="collapseStatus">{% translate "Status" %}</button>
</div>
<div class="collapse show my-3" id="collapseStatus">
  <label class="form-label">{% translate "Status" %}</label>
  {% for s in status_choices %}
    <div class="form-check">
      <input class="form-check-input"
             type="checkbox"
             name="status"
             value="{{ s.0 }}"
             id="status-check-{{ s.0 }}"
             {% if s.0|in_list:query_params.filtering.status__in %}checked{% endif %} />
      <label class="form-check-label" for="status-check-{{ s.0 }}">{{ s.1 }}</label>
    </div>
  {% endfor %}
</div>
