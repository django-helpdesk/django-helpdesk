{% load static i18n humanize in_list %}

<div class="d-grid">
  <button class="btn btn-light"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#collapseOwner"
          aria-expanded="false"
          aria-controls="collapseOwner">{% translate "Owner" %}</button>
</div>
<div class="collapse my-3" id="collapseOwner">
  {% with unassigned=-1 %}
    <div class="form-check">
      <input class="form-check-input"
             type="checkbox"
             name="assigned_to"
             value="{{ unassigned }}"
             id="owner-check-{{ unassigned }}"
             {% if query_params.filtering_null.assigned_to__id__isnull %}checked{% endif %} />
      <label class="form-check-label" for="owner-check-{{ unassigned }}">{% translate "Unassigned" %}</label>
    </div>
  {% endwith %}
  {% for u in assignable_users %}
    <div class="form-check">
      <input class="form-check-input"
             type="checkbox"
             name="assigned_to"
             value="{{ u.id }}"
             id="owner-check-{{ u.id }}"
             {% if u.id|in_list:query_params.filtering.assigned_to__id__in %}checked{% endif %} />
      <label class="form-check-label" for="owner-check-{{ u.id }}">{{ u.get_username }}</label>
    </div>
  {% endfor %}
</div>
