<tr>
  <td title="Drag & Drop" class="handle ms-3">
    <i class="fas fa-grip-vertical text-body-secondary"></i>
  </td>
  <td>
    <input class="form-control taskInput" oninput="updateTemplateTaskList()" required value="{{ value }}" />
  </td>
  <td>
    <button type="button" class="btn btn-sm bg-body-tertiary border" onclick="removeTask(this)">
      <i class="fas fa-times"></i>
    </button>
  </td>
</tr>
