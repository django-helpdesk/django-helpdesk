name: Checking Code Structure and Running Tests

on:
  pull_request:
  push:
    branches:
      - main
      # Maintenance lines, 2.4.x and whatever follows. A push to one of these is
      # a release candidate and deserves the same matrix as main, and it is the
      # only chance it gets: these branches never reach main through a pull
      # request, so nothing else would ever run the tests on them.
      - "*.x"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "5.2"
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        django-version: ["6.0", "6.1"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ hashFiles('pyproject.toml') }}-${{ matrix.python-version }}-${{ matrix.django-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          uv venv
          make sync

      - name: Run Lint and formatting checks
        run: |
          make checkformat

      - name: Run tests
        run: |
          # Resolve Django together with the packages that constrain it, rather
          # than layering `--with django~=X` over an environment that was
          # resolved against the newest Django. That layering silently produces
          # combinations the resolver would reject: DRF 3.18 requires Django
          # >= 5.2, so the 4.2 leg ended up running DRF 3.18 against Django 4.2
          # and failing at runtime instead of at resolution time.
          # `uv run --no-sync` is required, otherwise it re-syncs and undoes this.
          uv pip install "django~=${{ matrix.django-version }}" djangorestframework
          cd ${GITHUB_WORKSPACE} && uv run --no-sync coverage run quicktest.py # MAIN PART TO RUN TESTS IN CI/CD

      - name: Generate coverage reports
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        run: |
          mkdir -p ci-reports
          uv run --no-sync coverage report > ci-reports/coverage.txt
          uv run --no-sync coverage json -o ci-reports/coverage.json
          uv run --no-sync coverage html -d ci-reports/htmlcov
          uv run --no-sync python --version > ci-reports/python.txt
          uv pip freeze > ci-reports/packages.txt
          git rev-parse HEAD > ci-reports/commit.txt

      - name: Upload coverage reports
        if: ${{ !cancelled() && hashFiles('ci-reports/coverage.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-py${{ matrix.python-version }}-django${{ matrix.django-version }}
          path: ci-reports/
          retention-days: 90
          if-no-files-found: error

      - name: Convert coverage to LCOV
        if: matrix.python-version == '3.11' && matrix.django-version == '5.2'
        run: |
          uv run --no-sync coverage lcov

      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.11' && matrix.django-version == '5.2'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
          format: lcov
