name: Checking Code Structure and Running Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # limit number of matrices by applying sensible combinations
        # Django 6 only supports Python 3.12+
        include:
          # Explicitly include Python 3.10 only with Django 5.2
          - python-version: "3.10"
            django-version: "5.2"
          # Explicitly include Python 3.11 only with Django 5.2
          - python-version: "3.11"
            django-version: "5.2"
        # Define the general matrix for Python with Django
        python-version: [ "3.12", "3.13", "3.14"]
        django-version: ["6.0", "6.1"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ hashFiles('pyproject.toml') }}-${{ matrix.python-version }}-${{ matrix.django-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          uv venv
          make sync

      - name: Run Lint and formatting checks
        run: |
          make checkformat

      - name: Run tests
        run: |
          # Resolve Django together with the packages that constrain it, rather
          # than layering `--with django~=X` over an environment that was
          # resolved against the newest Django. That layering silently produces
          # combinations the resolver would reject: DRF 3.18 requires Django
          # >= 5.2, so the 4.2 leg ended up running DRF 3.18 against Django 4.2
          # and failing at runtime instead of at resolution time.
          # `uv run --no-sync` is required, otherwise it re-syncs and undoes this.
          uv pip install "django~=${{ matrix.django-version }}" djangorestframework
          cd ${GITHUB_WORKSPACE} && uv run --no-sync coverage run quicktest.py

      - name: Convert coverage to LCOV
        if: matrix.python-version == '3.11' && matrix.django-version == '5.2'
        run: |
          uv run coverage lcov

      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.11' && matrix.django-version == '5.2'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
          format: lcov
